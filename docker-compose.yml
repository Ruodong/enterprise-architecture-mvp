version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: ea-mvp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ea_mvp
    ports:
      - '5432:5432'
    volumes:
      - ea_mvp_pg_data:/var/lib/postgresql/data

volumes:
  ea_mvp_pg_data:
